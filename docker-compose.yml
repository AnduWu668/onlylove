services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onlylove
      POSTGRES_USER: onlylove
      POSTGRES_PASSWORD: onlylove
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - onlylove_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlylove -d onlylove"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  onlylove_postgres:
